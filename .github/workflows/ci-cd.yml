name: CI/CD
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  test:
    name: Install & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
            services/availability/package-lock.json
            services/booking/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Generate Prisma client (SQLite for CI)
        working-directory: backend
        env:
          DATABASE_URL: file:./test.db
        run: npx prisma generate --schema src/prisma/schema.sqlite.prisma
      - name: Prepare dev SQLite schema (Prisma db push)
        working-directory: backend
        env:
          DATABASE_URL: file:./test.db
        run: npx prisma db push --schema src/prisma/schema.sqlite.prisma
      - name: Seed dev SQLite data
        working-directory: backend
        env:
          DATABASE_URL: file:./test.db
        run: npm run db:seed
      - name: Run backend tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: npm test -- --coverage --watch=false
      - name: Upload backend coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage
          if-no-files-found: warn
          retention-days: 7
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend E2E tests (Cypress)
        working-directory: frontend
        env:
          CYPRESS_baseUrl: http://localhost:5173
          PIX_STUB: true
          DATABASE_URL: "file:./test.db"
          PORT: 4000
        run: npm run test:e2e:dev
      - name: Generate Cypress HTML report
        working-directory: frontend
        run: npm run report:e2e
      - name: Upload Cypress report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-e2e-report
          path: frontend/cypress/reports
          if-no-files-found: warn
          retention-days: 7
      - name: Build frontend
        working-directory: frontend
        run: npm run build -- --mode=production
      - name: Install availability service dependencies
        working-directory: services/availability
        run: npm ci
      - name: Run availability service tests
        working-directory: services/availability
        run: npm test -- --coverage --watch=false
      - name: Upload availability coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: availability-coverage
          path: services/availability/coverage
          if-no-files-found: warn
          retention-days: 7
      - name: Install booking service dependencies
        working-directory: services/booking
        run: npm ci
      - name: Run booking service tests
        working-directory: services/booking
        run: npm test -- --coverage --watch=false
      - name: Upload booking coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: booking-coverage
          path: services/booking/coverage
          if-no-files-found: warn
          retention-days: 7
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build -- --mode=production
      - name: Deploy frontend to Netlify
        if: ${{ env.NETLIFY_AUTH_TOKEN != '' && env.NETLIFY_SITE_ID != '' }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npm install -g netlify-cli
          netlify deploy --dir=frontend/dist --prod --site "$NETLIFY_SITE_ID"
      - name: Trigger Render deploy
        if: ${{ env.RENDER_API_KEY != '' && env.RENDER_BACKEND_SERVICE_ID != '' }}
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_BACKEND_SERVICE_ID: ${{ secrets.RENDER_BACKEND_SERVICE_ID }}
        run: |
          curl -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            https://api.render.com/v1/services/$RENDER_BACKEND_SERVICE_ID/deploys \
            -d '{"clearCache":false}'
