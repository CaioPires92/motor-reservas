services:
  - type: web
    name: motor-reservas-backend
    env: node
    plan: free
    region: oregon
    # Disco persistente para SQLite
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 2

    buildCommand: npm install && npx prisma generate --schema src/prisma/schema.prisma && npx prisma db push --schema src/prisma/schema.prisma && node src/prisma/seed.js
    # --- Postgres + migrações (recomendado para produção) ---
    # Quando migrar para Postgres e versionar migrações Prisma, troque o buildCommand por:
    # buildCommand: npm install && npx prisma generate --schema src/prisma/schema.prisma && npx prisma migrate deploy --schema src/prisma/schema.prisma && node src/prisma/seed.js

    startCommand: node src/app.js
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: DATABASE_URL
        value: file:/var/data/dev.db
      - key: PIX_STUB
        value: "true"
      - key: AVAILABILITY_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
    rootDir: backend
