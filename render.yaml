services:
  - type: web
    name: motor-reservas-backend
    env: node
    plan: free
    region: oregon
    # SQLite efêmero no plano free (sem disco anexado)

    # Produção: usa migrações versionadas do Prisma com PostgreSQL
    # Build para SQLite em testes: sincroniza schema com db push (sem migrations versionadas)
    buildCommand: npm install && npx prisma generate --schema src/prisma/schema.prisma && npx prisma db push --schema src/prisma/schema.prisma && node src/prisma/seed.js

    startCommand: node src/app.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "18"
      - key: DATABASE_URL
        value: "file:./src/prisma/dev.db"
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: RATE_LIMIT_RESERVAS_MAX
        value: "10"
      - key: RATE_LIMIT_PIX_MAX
        value: "10"
      - key: ENABLE_ERROR_TEST
        value: "false"
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: MP_PUBLIC_KEY
        sync: false
      - key: PIX_STUB
        value: "true"
      - key: AVAILABILITY_URL
        sync: false
      - key: AVAILABILITY_TIMEOUT_MS
        value: "3000"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
    rootDir: backend
