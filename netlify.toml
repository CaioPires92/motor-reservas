[build]
  base = 'frontend'
  command = 'npm install && npm run build'
  publish = "dist"
[[redirects]]
  from = "/api/*"
  to = "https://motor-reservas-backend.onrender.com/api/:splat"
  status = 200
  force = true
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
[dev]
  command = "npm run dev"
  port = 5173
  targetPort = 5173
  framework = "vite"
[[redirects]]
  from = "/api/*"
  to = "https://motor-reservas-backend.onrender.com/api/:splat"
  status = 200
  force = true
